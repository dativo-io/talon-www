name: Build site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Show build runtime
        run: |
          node --version
          npm --version

      - name: Test screenshot freshness gate
        run: node --test scripts/test-console-screenshot-lock.cjs

      - name: Test canonical sitemap inventory
        run: node scripts/test-site-inventory.cjs

      - name: Test SEO metadata encoding
        run: node --test scripts/test-growth-metadata.cjs

      # The build verifies the release commit, reviewed errata and screenshot lock.
      - name: Build static site and Docusaurus docs
        run: bash scripts/build-site-with-docs.sh

      # Keep both the buyer-facing use-case route and its canonical technical
      # documentation route in the deployable artifact.
      - name: Validate published SEO metadata and sitemap
        run: node scripts/verify-seo.cjs dist

      - name: Verify generated marketing and documentation sitemap completeness
        run: node scripts/verify-sitemap-completeness.cjs dist

      - name: Audit all canonical marketing metadata and site links
        run: node scripts/audit-built-site.cjs dist --strict

      - name: Upload crawl audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-crawl-audit
          path: site-audit.json
          if-no-files-found: ignore

      - name: Unit test clean-traffic reporting
        run: node scripts/test-report-traffic.cjs

      - name: Verify expected outputs
        run: |
          test -f dist/index.html
          test -f dist/mcp-tool-governance/index.html
          test -f dist/ai-agent-audit-trail/index.html
          test -f dist/comparisons/talon-vs-litellm/index.html
          test -f dist/use-cases/index.html
          test -f dist/use-cases/coding-agents/index.html
          test -f dist/use-cases/customer-support/index.html
          test -f dist/use-cases/people-analytics/index.html
          test -f dist/use-cases/vendor-contract-review/index.html
          test -f dist/sitemap.xml
          test -f dist/ai-cost-control/index.html
          test -f dist/ai-action-control/index.html
          test -f dist/llm-governance-gateway/index.html
          test -f dist/coding-agent-governance/index.html
          test -f dist/github-copilot-governance/index.html
          test -f dist/talon/docs/index.html
          test -f dist/talon/docs/use-case-playbooks/index.html
          test -f dist/talon/docs/evaluation-checklist/index.html
          test -f dist/talon/docs/sitemap.xml
          test -f dist/talon/docs/air-gapped-deployment/index.html
          test -f dist/talon/docs/external-scanners/index.html
          test -f dist/talon/docs/local-scanner-engines/index.html
          test -f dist/talon/docs/operational-control-plane/index.html
          test -f dist/talon/docs/operations-console/index.html
          test -f dist/talon/docs/proxy-quickstart/index.html
          test -f dist/talon/docs/explanation-catalog/index.html
          test -f dist/talon/docs/copaw-integration/index.html
          test -f dist/talon/docs/copaw-docker-primer/index.html
          test -f dist/talon/docs/openclaw-docker-primer/index.html
          test -f dist/talon/docs/governing-coding-agents/index.html
          test -f dist/talon/docs/coding-agents-demo/index.html
          test -f dist/talon/docs/claude-code-integration/index.html
          test -f dist/talon/docs/codex-cli-integration/index.html
          test -f dist/talon/docs/github-copilot-cli-governance/index.html

      - name: Install pinned browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/talon-site-qa" --no-audit --no-fund --save-exact playwright@1.65.1 axe-core@4.14.1 @lhci/cli@0.14.0
          echo "NODE_PATH=$RUNNER_TEMP/talon-site-qa/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Start built-site preview
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory dist > /tmp/talon-preview.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Browser smoke, keyboard, accessibility and acquisition events
        run: node scripts/browser-smoke.cjs

      - name: Lighthouse CI mobile lab measurements
        if: always() && env.CHROME_PATH != ''
        run: |
          "$RUNNER_TEMP/talon-site-qa/node_modules/.bin/lhci" collect --config=scripts/lighthouserc.cjs
          "$RUNNER_TEMP/talon-site-qa/node_modules/.bin/lhci" assert --config=scripts/lighthouserc.cjs
          "$RUNNER_TEMP/talon-site-qa/node_modules/.bin/lhci" upload --config=scripts/lighthouserc.cjs

      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-quality
          path: |
            site-qa/
            .lighthouseci/
          if-no-files-found: warn

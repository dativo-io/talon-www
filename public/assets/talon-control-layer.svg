<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" role="img" aria-labelledby="title desc">
  <title id="title">Talon as a shared AI control layer</title>
  <desc id="desc">Existing support, document and coding workflows connect through Talon to existing AI providers, APIs and tools. Talon governs supported model and action paths.</desc>

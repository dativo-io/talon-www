      <rect x="24" y="8" width="208" height="52" rx="10"/>
      <rect x="256" y="8" width="208" height="52" rx="10"/>
      <rect x="488" y="8" width="208" height="52" rx="10"/>
    </g>
    <g fill="#14213A" font-size="21" font-weight="600">
      <text x="128" y="40">Support</text><text x="360" y="40">Documents</text><text x="592" y="40">Coding</text>
    </g>
    <g stroke="#7184A6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 60 V79 H592 V60 M360 60 V101"/>
      <path d="M354 95 L360 101 L366 95"/>

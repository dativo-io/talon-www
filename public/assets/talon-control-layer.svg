    <rect x="24" y="102" width="672" height="112" rx="12" fill="#081E58"/>
    <text x="360" y="138" fill="#FFFFFF" font-size="26" font-weight="650">Dativo Talon</text>
    <g fill="#24396D">
      <rect x="42" y="157" width="150" height="39" rx="6"/>
      <rect x="204" y="157" width="150" height="39" rx="6"/>
      <rect x="366" y="157" width="150" height="39" rx="6"/>
      <rect x="528" y="157" width="150" height="39" rx="6"/>
    </g>
    <g fill="#FFFFFF" font-size="19" font-weight="500">
      <text x="117" y="182">Policy</text><text x="279" y="182">Cost</text><text x="441" y="182">Reliability</text><text x="603" y="182">Evidence</text>
    </g>
    <g stroke="#7184A6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
